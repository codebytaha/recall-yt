<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recall settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Recall</h1>
      <form id="settings-form" novalidate>
        <div class="field">
          <label for="interval">Interval (minutes)</label>
          <input
            id="interval"
            name="intervalMinutes"
            type="number"
            min="1"
            max="60"
            step="1"
            value="10"
            inputmode="numeric"
            required
          />
        </div>
        <div class="field">
          <label for="questions">Questions per stop</label>
          <input
            id="questions"
            name="questionsPerStop"
            type="number"
            min="1"
            max="8"
            step="1"
            value="4"
            inputmode="numeric"
            required
          />
        </div>
        <div class="field">
          <label for="saved-model">Saved models</label>
          <select id="saved-model"></select>
        </div>
        <div class="field">
          <label for="model-name" id="model-name-label">Name</label>
          <input id="model-name" type="text" autocomplete="off" spellcheck="false" />
          <p class="quiet">An OpenAI-compatible provider needs a name. Recall says that name while it is calling.</p>
        </div>
        <div class="field">
          <label for="provider">Provider</label>
          <select id="provider" name="provider">
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="openai-compatible">OpenAI-compatible</option>
          </select>
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input
            id="model"
            name="model"
            type="text"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="field" id="base-url-field" hidden>
          <label for="base-url">Base URL</label>
          <input
            id="base-url"
            name="baseUrl"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://example.com/v1"
          />
        </div>
        <div class="field">
          <label for="api-key">API key</label>
          <input
            id="api-key"
            name="apiKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="key-note"
          />
          <p id="key-note" class="quiet">The key stays in this browser.</p>
        </div>
        <div class="actions">
          <button type="submit" id="save">Save</button>
          <button type="button" id="add-model">Add model</button>
          <button type="button" id="remove-model">Remove</button>
          <button type="button" id="test-key">Test key</button>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="options.ts"></script>
  </body>
</html>
