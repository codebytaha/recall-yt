<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recall</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Recall</h1>
      <label class="arm">
        <input id="armed" type="checkbox" />
        <span>Quiz me on YouTube</span>
      </label>
      <p id="arm-copy" class="quiet">Off until you turn it on.</p>
      <p id="checkpoint" class="status" hidden></p>
      <p id="score" class="status" hidden></p>
      <p id="empty" class="quiet">Open a lesson and press play.</p>
      <section id="move">
        <h2>This lesson</h2>
        <div class="row">
          <button type="button" id="prev">Previous</button>
          <button type="button" id="next">Next</button>
        </div>
        <label class="jump" for="stops">Jump to</label>
        <select id="stops"></select>
        <p id="move-note" class="quiet" hidden></p>
      </section>
      <section id="review">
        <h2>Due today</h2>
        <p id="review-count" class="quiet">No cards due.</p>
        <p id="review-prompt" hidden></p>
        <div id="review-choices" class="choices"></div>
        <p id="review-result" class="status" hidden></p>
        <p id="review-excerpt" class="quiet" hidden></p>
        <div id="review-grades" class="row" hidden>
          <button type="button" id="again">Again</button>
          <button type="button" id="good">Good</button>
          <button type="button" id="easy">Easy</button>
        </div>
      </section>
      <button type="button" id="settings">Settings</button>
    </main>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
